# Розмістити як /etc/nginx/sites-available/fachkraft-cv-kompass
# і зробити симлінк у sites-enabled (див. DEPLOY.md).
#
# ЗАМІНІТЬ your-domain.example.com на реальний (під)домен, що вказує
# на IP цього сервера (A-запис у DNS).

server {
    listen 80;
    server_name your-domain.example.com;

    # Статика фронтенда (результат `npm run build` у frontend/dist)
    root /var/www/fachkraft-cv-kompass/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксі на Express-бекенд (запущений через PM2 на порту 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Certbot підставить сюди SSL-блок автоматично (сертифікат + редірект на 443)
}
